# STEP 2-B에서 확정한 동일 frame과 저장된 YuNet detection bbox를 재사용한다.
source_results_dir: "outputs/preprocessing_v2/detector_primary_comparison"
step2b_config: "configs/detector_primary_comparison.yaml"
raw_dir: "data/raw/SUST Driver Drowsiness Dataset"
train_metadata: "data/metadata/train.csv"
val_metadata: "data/metadata/val.csv"
yunet_model: "assets/yunet/face_detection_yunet_2023mar.onnx"
dlib_predictor: "assets/dlib/shape_predictor_68_face_landmarks.dat"

# margin은 bbox width와 height에 각각 독립적으로 적용하며 강제 square 변환은 하지 않는다.
margin_candidates:
  RAW: 0.00
  M05: 0.05
  M10: 0.10
  M15: 0.15

visual_audit:
  target_samples: 35
  contact_sheet_columns: 1
  contact_sheet_rows: 2
  panel_size: [480, 360]

output_dir: "outputs/preprocessing_v2/landmark_roi_margin_audit"
